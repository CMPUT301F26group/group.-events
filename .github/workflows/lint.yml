name: Kotlin Lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - run: chmod +x gradlew
      - run: ./gradlew ktlintCheck
      - run: ./gradlew detekt
